name: TODO Registrar Statistic

on:
  workflow_call:
    inputs:
      config:
        description: 'Inline YAML configuration for TODO Registrar'
        required: false
        type: string
        default: ''
      verbosity:
        description: 'Verbosity level: quiet, normal, verbose, very-verbose, debug'
        required: false
        type: string
        default: 'normal'

jobs:
  statistic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: Verify GitHub App credentials
        shell: bash
        run: |
          if [[ -z "${{ secrets.TODO_REGISTRAR_APP_ID }}" ]]; then
            echo "::error::TODO_REGISTRAR_APP_ID is missing in Aeliot-Tm/todo-registrar-statistic-action repository secrets."
            exit 1
          fi
          if [[ -z "${{ secrets.TODO_REGISTRAR_APP_PRIVATE_KEY }}" ]]; then
            echo "::error::TODO_REGISTRAR_APP_PRIVATE_KEY is missing in Aeliot-Tm/todo-registrar-statistic-action repository secrets."
            exit 1
          fi

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.TODO_REGISTRAR_APP_ID }}
          private-key: ${{ secrets.TODO_REGISTRAR_APP_PRIVATE_KEY }}

      - name: TODO Registrar statistic
        uses: ./
        with:
          config: ${{ inputs.config }}
          verbosity: ${{ inputs.verbosity }}
          github_token: ${{ steps.app-token.outputs.token }}
