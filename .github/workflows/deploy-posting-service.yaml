name: Deploy posting service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'service/**'
      - '.github/workflows/deploy-posting-service.yaml'

jobs:
  deploy:
    if: github.repository == 'Aeliot-Tm/todo-registrar-statistic-action'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: service/package.json

      - name: Install service dependencies
        working-directory: service
        run: npm install

      - name: Verify service sources
        working-directory: service
        run: npm run check

      - name: Upload Worker secrets
        working-directory: service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TODO_REGISTRAR_APP_ID: ${{ secrets.TODO_REGISTRAR_APP_ID }}
          TODO_REGISTRAR_APP_PRIVATE_KEY: ${{ secrets.TODO_REGISTRAR_APP_PRIVATE_KEY }}
        run: |
          printf '%s' "$TODO_REGISTRAR_APP_ID" | npx wrangler secret put TODO_REGISTRAR_APP_ID
          printf '%s' "$TODO_REGISTRAR_APP_PRIVATE_KEY" | npx wrangler secret put TODO_REGISTRAR_APP_PRIVATE_KEY

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: service
          command: deploy
